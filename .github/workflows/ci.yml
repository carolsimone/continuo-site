name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Sync mirrored docs
        run: npm run sync-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run check

      - run: npx astro build

      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ./dist --include-fragments './dist/**/*.html'
          fail: true
